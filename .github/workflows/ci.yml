name: CI

on:
  push:
    branches: [main, 'improve/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, property-based, dan test RLS (PGlite)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Pasang Chromium untuk E2E
        run: npx playwright install --with-deps chromium
      - name: E2E (desktop dan 360px)
        run: npm run e2e
        env:
          CI: 'true'
          PW_CHROMIUM_PATH: ''
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
